name: Build Yasin TV Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          archive="$(find . -maxdepth 1 -type f -iname 'YasinWidgetLauncher*.zip' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "Не найден архив YasinWidgetLauncher*.zip в корне репозитория"
            exit 1
          fi
          mkdir project
          unzip -q "$archive" -d project
          if [ -d project/yasin_src ]; then
            echo "PROJECT_DIR=project/yasin_src" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - name: Patch Kotlin compile issues
        run: |
          MAIN_KT="$PROJECT_DIR/app/src/main/java/com/aktobe/yasinlauncher/MainActivity.kt"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$MAIN_KT" ]; then
            echo "Не найден MainActivity.kt: $MAIN_KT"
            exit 1
          fi
          sed -i 's/info\.loadBanner(pm)/info.activityInfo.loadBanner(pm)/' "$MAIN_KT"
          if ! grep -q 'androidx.lifecycle:lifecycle-runtime-ktx' "$BUILD_FILE"; then
            sed -i '/^dependencies {/a\    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")' "$BUILD_FILE"
          fi
          echo "Проверка исправлений:"
          grep -n 'loadBanner\|lifecycle-runtime-ktx' "$MAIN_KT" "$BUILD_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден в $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YasinTVLauncher-debug
          path: project/yasin_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
