name: Build Yasin TV Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          archive="$(find . -maxdepth 1 -type f -iname 'YasinWidgetLauncher*.zip' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "Не найден архив YasinWidgetLauncher*.zip в корне репозитория"
            exit 1
          fi
          mkdir project
          unzip -q "$archive" -d project
          if [ -d project/yasin_src ]; then
            echo "PROJECT_DIR=project/yasin_src" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YasinTVLauncher-debug
          path: project/yasin_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
